            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

        .nameplate-btn.correct {

            color: #166534;
            font-weight: 700;
        }

        .nameplate-btn.incorrect {
            border-color: #f87171; 
            background-color: #fef2f2; 
            color: #991b1b;
            font-weight: 700;
        }

        .nameplate-btn:disabled {
            cursor: default;
        }

            from { opacity: 0; transform: scale(0.95); }

                desc: "초록의 잔상이 짙게 피어오르는 새벽, 싱그러움이 담긴 클라리 세이지와 라벤더가 만나 향긋한 허브의 내음을 전합니다. 쌉싸름한 쑥과 포근한 인센스는 안개 낀 숲 속의 고요함 속에 촉촉하고 부드러운 이끼의 잔향을 남기며 아무도 없는 맑고 잔잔한 호수 위를 유영하듯 마음속까지 정갈해지는 경험을 선사합니다.",
                top: "Clary sage, Lavender", mid: "Artemisia, Incense, Water", base: "Moss, Amber, Musk",
                accords: ["Mossy", "Musk"],
                notes: ["Clary sage", "Lavender", "Artemisia", "Incense", "Water", "Moss", "Amber", "Musk"]
            },
            {
                image: "13.bottari.png", 
                title: "BOTTARI", subtitle: "보타리",
                desc: "보타리는 버섯 포자가 터질 때 느껴지는 폭발적인 생명력을 닮아, 깊고 감각적인 향의 파동으로 주변을 장악합니다. 단단한 매듭 속에 감춰진 것들이 하나씩 모습을 드러내며 호기심을 자아내고, 시원한 아키갈라우드를 가득 머금은 공기가 스치면 젖은 대지 위 부드러운 이끼와 나뭇결의 내음이 뒤따르며 예상치 못한 향의 변주가 시작됩니다. 그리고 마침내 보따리가 완전히 펼쳐지면, 생소한 물건들이 쏟아져 나오듯이 신비로운 앰버그리스와 묵직한 머스크가 만나 폭발하듯 퍼뜨려지며 어두운 하늘에 반짝이는 수천 개의 별처럼 아름다운 형상을 수놓아 공기를 황홀하게 물들입니다.",
                top: "Akigala wood", mid: "Ambroxan, Ambrette", base: "Ambergris, Musk, Moss",
                accords: ["Amber", "Musk"],
                notes: ["Akigala wood", "Ambroxan", "Ambrette", "Ambergris", "Musk", "Moss"]
            },
            {
                image: "14.brown.png", 
                title: "BROWN", subtitle: "브라운",
                desc: "마호가니의 우아하고 부드러운 색에서 영감을 받은 브라운은 깨끗한 올리바넘 향취가 마호가니 나뭇결과 만나 풍부한 질감이 느껴지는 우디향으로, 마치 고요한 사찰의 틈에서 물기 머금은 나무둥치를 마주한 듯 차분한 느낌을 줍니다. 뒤이어 섬세한 장미향이 은은한 여운을 더하고 앰버와 패출리가 따뜻하고 중독성 있는 향으로 마무리 됩니다.",
                top: "Grass, Olibanum", mid: "Rose, Mahogany", base: "Amber, Patchouli, Oakwood",
                accords: ["Amber", "Woody"],
                notes: ["Grass", "Olibanum", "Rose", "Mahogany", "Amber", "Patchouli", "Oakwood"]
            },
            {
                image: "15.blue_hinoki.png", 
                title: "BLUE HINOKI", subtitle: "블루 히노키",
                desc: "푸른 물결을 따라 바다로 흘러든 히노키 나무가 상쾌한 파인오일과 베르가못의 서늘한 기류에 실려, 파도를 가르는 바람처럼 경쾌하게 퍼져 나갑니다. 소금기를 머금은 단단한 나뭇결은 오랜 시간 담금질에 파도의 형상으로 부드럽게 조형되고, 내리쬐는 햇볕 아래 풍화되며 뒤틀린 끝에 은은한 울림을 주는 올리바넘과 만나 시원한 바다의 색을 지닌 나무로 다시 태어납니다.",
                top: "Pine Oil, Bergamot, Hibiscus", mid: "Water Note, Hinoki", base: "Cedarwood, Driftwood, Olibanum Resinoid",
                accords: ["Woody", "Marine"],
                notes: ["Pine Oil", "Bergamot", "Hibiscus", "Water Note", "Hinoki", "Cedarwood", "Driftwood", "Olibanum Resinoid"]
            }
        ];

        let currentQuizQueue = [];
        let currentQuestionIndex = 0;
        let score = 0;

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const startBtn = document.getElementById('start-btn');
        const perfumeImage = document.getElementById('perfume-image');
        const optionsContainer = document.getElementById('options-container');
        const feedbackText = document.getElementById('feedback-text');
        const restartBtn = document.getElementById('restart-btn');
        const progressText = document.getElementById('progress-text');

        const detailModal = document.getElementById('detail-modal');
        const modalStatusTitle = document.getElementById('modal-status-title');
        const modalNextBtn = document.getElementById('modal-next-btn');

        // 전체 향료 추출 (중복 제거)
        const allAvailableNotes = [...new Set(productData.flatMap(p => p.notes))];

        // 2. 퀴즈 생성 로직: 매번 랜덤하게 정답과 보기를 생성
        function generateQuiz() {
            currentQuizQueue = productData.map(product => {
                // 정답 랜덤 추출 (현재 향수의 notes 중 하나)
                const randomAnswer = product.notes[Math.floor(Math.random() * product.notes.length)];
                
                // 오답 5개 추출 (전체 향료 중 현재 향수에 포함되지 않은 것들)
                const wrongNotes = allAvailableNotes
                    .filter(note => !product.notes.includes(note)) // 현재 향수 향료 제외
                    .sort(() => Math.random() - 0.5)               // 셔플
                    .slice(0, 5);                                  // 5개 뽑기
                
                // 보기 6개 생성 및 셔플
                const options = [randomAnswer, ...wrongNotes].sort(() => Math.random() - 0.5);

                // 출제용 객체 리턴
                return {
                    ...product,
                    answer: randomAnswer,
                    options: options
                };
            }).sort(() => Math.random() - 0.5); // 향수 출제 순서도 셔플
        }

        startBtn.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            generateQuiz();
            loadQuestion();
        });

        function loadQuestion() {
            feedbackText.textContent = '';
            feedbackText.className = 'text-2xl font-bold h-8 mb-4';
            optionsContainer.innerHTML = '';
            
            const currentQuestion = currentQuizQueue[currentQuestionIndex];
            perfumeImage.src = currentQuestion.image;
            progressText.textContent = `Note ${currentQuestionIndex + 1} / ${currentQuizQueue.length}`;

            currentQuestion.options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'nameplate-btn';
                button.textContent = option;
                button.addEventListener('click', () => handleGuess(option, button));
                optionsContainer.appendChild(button);
            });
        }

        function handleGuess(selectedOption, buttonElement) {
            const currentQuestion = currentQuizQueue[currentQuestionIndex];
            const isCorrect = selectedOption === currentQuestion.answer;
            const allButtons = optionsContainer.querySelectorAll('button');
            allButtons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                feedbackText.textContent = 'Correct!';
                feedbackText.className = 'text-2xl font-bold h-8 mb-4 text-green-600';
                buttonElement.classList.add('correct');
                modalStatusTitle.textContent = "Correct! Review the details.";
                modalStatusTitle.className = "font-bold text-green-600 text-lg";
                score++;
            } else {
                feedbackText.textContent = 'Incorrect!';
                feedbackText.className = 'text-2xl font-bold h-8 mb-4 text-red-500';
                buttonElement.classList.add('incorrect');
                modalStatusTitle.textContent = "Incorrect! Review the details.";
                modalStatusTitle.className = "font-bold text-red-500 text-lg";
                
                // 오답일 경우 정답 표시
                allButtons.forEach(btn => {
                    if (btn.textContent === currentQuestion.answer) {
                        btn.classList.add('correct');
                    }
                });
            }

            // 모달 데이터 채우기 (기존의 길었던 코드를 지우고 함수 하나로 깔끔하게 처리!)
            setTimeout(() => {
                showDetailModal(currentQuestion, true); // true를 넘겨서 다시 퀴즈 모드로 전환
            }, 800);
        }

        let isQuizMode = true; // 현재 모달이 퀴즈 도중에 열렸는지, 도감(메뉴)에서 열렸는지 체크

        modalNextBtn.addEventListener('click', () => {
            detailModal.classList.add('hidden'); 
            
            if (isQuizMode) {
                // 퀴즈 모드일 때는 다음 문제로 넘어가거나 결과를 보여줌
                if (currentQuestionIndex < currentQuizQueue.length - 1) {
                    currentQuestionIndex++;
                    loadQuestion();
                } else {
                    feedbackText.textContent = `Final Score: ${score} / ${currentQuizQueue.length}`;
                    feedbackText.className = 'text-2xl font-bold h-8 mb-4 text-blue-600';
                    restartBtn.classList.remove('hidden');
                }
            }
        });

        restartBtn.addEventListener('click', () => {
            currentQuestionIndex = 0;
            score = 0;
            restartBtn.classList.add('hidden');
            generateQuiz(); // 퀴즈 다시 생성
            loadQuestion(); 
        });

        // ====== 사이드바(도감) 관련 로직 ======
        const collectionBtn = document.getElementById('collection-btn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const closeSidebarBtn = document.getElementById('close-sidebar-btn');
        const sidebarContent = document.getElementById('sidebar-content');

        // 사이드바 열기/닫기
        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            sidebarOverlay.classList.remove('hidden');
            renderSidebar(); // 열 때마다 리스트 렌더링 (또는 최초 1회만 해도 됨)
        }
        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        }

        collectionBtn.addEventListener('click', openSidebar);
        closeSidebarBtn.addEventListener('click', closeSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);

        // 사이드바에 데이터 렌더링 (title 기준 알파벳 오름차순 정렬)
        function renderSidebar() {
            sidebarContent.innerHTML = '';
            
            // 원본 데이터(productData)를 복사하여 제목 오름차순 정렬
            const sortedData = [...productData].sort((a, b) => a.title.localeCompare(b.title));

            sortedData.forEach(product => {
                // 카드 UI 생성
                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4 cursor-pointer hover:shadow-md hover:border-gray-300 transition-all active:scale-[0.98]";
                card.innerHTML = `
                    <div class="w-14 h-14 bg-gray-50 flex-shrink-0 border border-gray-100 rounded-md p-1 flex justify-center items-center">
                        <img src="${product.image}" alt="${product.title}" class="w-full h-full object-contain">
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <h3 class="font-bold text-gray-800 truncate text-sm">${product.title}</h3>
                        <p class="text-xs text-gray-500 truncate mt-0.5">${product.subtitle}</p>
                    </div>
                `;
                
                // 카드 클릭 시 모달 열기 (도감 뷰 모드)
                card.addEventListener('click', () => {
                    showDetailModal(product, false);
                });
                
                sidebarContent.appendChild(card);
            });
        }

        // 모달창에 데이터를 꽂아넣고 띄우는 함수 (재사용 가능하도록 분리)
        function showDetailModal(product, quizMode) {
            isQuizMode = quizMode; // 현재 상태 저장
            
            // 데이터 꽂아넣기
            document.getElementById('ui-title').textContent = product.title;
            document.getElementById('ui-subtitle').textContent = product.subtitle;
            document.getElementById('ui-desc').textContent = product.desc;
            document.getElementById('ui-top').textContent = product.top;
            document.getElementById('ui-mid').textContent = product.mid;
            document.getElementById('ui-base').textContent = product.base;
            
            const accordsContainer = document.getElementById('ui-accords');
            accordsContainer.innerHTML = '';
            product.accords.forEach(accord => {
                const span = document.createElement('span');
                span.className = "bg-gray-200 text-gray-700 text-xs font-bold px-3 py-1 rounded-full";
                span.textContent = accord;
                accordsContainer.appendChild(span);
            });
            
            // 모달 버튼 및 타이틀 상태 변경
            if (isQuizMode) {
                modalNextBtn.textContent = (currentQuestionIndex === currentQuizQueue.length - 1) ? "Result" : "Next";
            } else {
                // 사이드바에서 열었을 때
                modalStatusTitle.textContent = "Detail Info";
                modalStatusTitle.className = "font-bold text-gray-800 text-lg";
                modalNextBtn.textContent = "Close";
            }
            
            detailModal.classList.remove('hidden');
        }
    </script>
</body>
</html>
