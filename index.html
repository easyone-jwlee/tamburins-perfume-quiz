<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Art of Scent : TAMBURINS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #e1ebd1; 
            -webkit-tap-highlight-color: transparent; 
        }

        .polaroid-frame {
            background-color: #fcfcfc;
            padding: 16px;
            box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nameplate-btn {
            background-color: #ffffff;
            border: 8px solid #f2f4ee; 
            box-shadow: 1px 2px 5px rgba(0, 0, 0, 0.05);
            color: #333333;
            font-weight: 500;
            padding: 12px 4px;
            transition: all 0.2s ease;
            cursor: pointer;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            word-break: keep-all;
        }

        .nameplate-btn:active:not(:disabled) {
            transform: scale(0.96);
            box-shadow: inset 1px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .nameplate-btn.correct {
            border-color: #4ade80; 
            background-color: #f0fdf4; 
            color: #166534;
            font-weight: 700;
        }

        .nameplate-btn.incorrect {
            border-color: #f87171; 
            background-color: #fef2f2; 
            color: #991b1b;
            font-weight: 700;
        }

        .nameplate-btn:disabled {
            cursor: default;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-animate {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen text-gray-800 py-10 px-4">

    <!-- 1. 시작 화면 (초기 노출) -->
    <div id="start-screen" class="w-full max-w-md flex flex-col items-center mt-4">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">The Art of Scent : TAMBURINS</h1>
        </div>
        <div class="polaroid-frame mx-auto w-4/5 max-w-[280px] aspect-square mb-10 bg-white">
            <img src="0.tamburins.png" alt="TAMBURINS Logo" class="w-full h-full object-contain">
        </div>
        <button id="start-btn" class="w-full max-w-[200px] bg-gray-900 hover:bg-black text-white font-bold py-3 px-6 rounded-full shadow-lg transition-transform active:scale-95">
            Start
        </button>
    </div>

    <!-- 2. 메인 퀴즈 화면 (처음엔 hidden) -->
    <div id="quiz-screen" class="hidden w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">The Art of Scent : TAMBURINS</h1>
            <p id="progress-text" class="text-gray-600 mt-1 text-sm font-medium">Note 1 / 5</p>
        </div>

        <div class="polaroid-frame mx-auto w-4/5 max-w-[280px] aspect-square mb-10 bg-white">
            <img id="perfume-image" src="" alt="Perfume" class="w-full h-full object-contain">
        </div>

        <div id="options-container" class="grid grid-cols-2 gap-x-4 gap-y-5">
            <!-- 버튼 자동 생성 -->
        </div>

        <div class="mt-8 flex flex-col items-center min-h-[100px]">
            <div id="feedback-text" class="text-2xl font-bold h-8 mb-4 transition-opacity duration-300"></div>
            <button id="restart-btn" class="hidden w-full max-w-[200px] bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-transform active:scale-95">
                Retry
            </button>
        </div>
    </div>

    <!-- UI 상세 설명 팝업(모달) -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-black bg-opacity-75 z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full max-h-[90vh] flex flex-col overflow-hidden modal-animate shadow-2xl">
            <div class="px-4 py-3 border-b flex justify-between items-center bg-gray-50">
                <span id="modal-status-title" class="font-bold text-lg">Detail</span>
            </div>
            
            <div class="overflow-y-auto p-6 flex-grow bg-white text-left">
                <h2 id="ui-title" class="text-3xl font-bold text-gray-900 tracking-tighter">CHAMO</h2>
                <h3 id="ui-subtitle" class="text-md font-medium text-gray-500 mb-4">카모</h3>
                <p id="ui-desc" class="text-sm text-gray-700 leading-relaxed mb-6 break-keep"></p>

                <h4 class="font-bold text-sm text-gray-900 mb-3 border-b pb-1">Olfactory Pyramid</h4>
                <div class="flex flex-col gap-2 mb-6 text-sm bg-gray-50 p-4 rounded-lg">
                    <div class="flex"><span class="font-bold w-12 text-gray-400">TOP</span><span id="ui-top" class="text-gray-800"></span></div>
                    <div class="flex"><span class="font-bold w-12 text-gray-400">MID</span><span id="ui-mid" class="text-gray-800"></span></div>
                    <div class="flex"><span class="font-bold w-12 text-gray-400">BASE</span><span id="ui-base" class="text-gray-800"></span></div>
                </div>

                <h4 class="font-bold text-sm text-gray-900 mb-3 border-b pb-1">Main Accords</h4>
                <div id="ui-accords" class="flex flex-wrap gap-2"></div>
            </div>

            <div class="p-4 border-t bg-gray-50">
                <button id="modal-next-btn" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3 px-6 rounded-full shadow-lg transition-transform active:scale-95">
                    Next
                </button>
            </div>
        </div>
    </div>

    <!-- 스크롤 시에도 화면 우측 하단에 고정되는 워터마크 (fixed, z-10 적용) -->
    <div class="fixed bottom-4 right-4 text-right text-gray-500 text-xs opacity-70 z-10 pointer-events-none">
        <p class="font-bold">이지엽</p>
        <p>tam1532@tamburins.com</p>
        <p>TAM_서울_DS_현대_무역</p>
        <p>스토어브랜딩팀</p>
    </div>

    <script>
        // 1. 제품 데이터 구조화 (정답/보기를 제거하고 notes 배열 추가)
        const productData = [
            {
                image: "01.chamo.png", 
                title: "CHAMO", subtitle: "카모",
                desc: "꿀처럼 진득하고 달콤한 카모마일과 쌉쌀한 클라리세이지의 허벌한 향취가 오묘한 조화를 이루어 중독성 있는 향을 선사합니다. 자칫 차갑게 느껴질 수 있는 축축한 이끼의 느낌을 우아하고 부드러운 나무결의 블론드우드와 따뜻한 머스크로 감싸주어 당신의 지친 마음에 특별하고 작은 위안을 선물합니다.",
                top: "Chamomile, Clarysage", mid: "Cypriol, Water", base: "Blond wood, Amber, Musk",
                accords: ["Herbal", "Musk"],
                // 향수 문제 출제 풀 (이 중에서 랜덤으로 1개가 정답으로 지정됨)
                notes: ["Chamomile", "Clarysage", "Cypriol", "Water", "Blond wood", "Amber", "Musk"]
            },
            {
                image: "02.berga_sandal.png",
                title: "BERGA SANDAL", subtitle: "버가샌달",
                desc: "지중해의 푸릇한 기운을 받고 자란 베르가못의 청량한 향에 라임, 카다멈의 신선하고 쌉싸래한 향이 더해져 따사로운 햇빛 아래 서서히 익어가는 청귤을 떠오르게 합니다. 뒤이어 샌달우드가 그려내는 부드러운 곡선의 잔향은 주위에 은은하게 머물며 햇살 가득한 여름날의 따뜻한 기억을 그려냅니다.",
                top: "Bergamot, Lime, Cardamom", mid: "Cedar atlas, Cypriol, Cucumber", base: "Sandalwood, Leather, Amyris",
                accords: ["Citrus", "Woody"],
                notes: ["Bergamot", "Lime", "Cardamom", "Cedar atlas", "Cypriol", "Cucumber", "Sandalwood", "Leather", "Amyris"]
            },
            {
                image: "03.lale.png",
                title: "LALE", subtitle: "라레",
                desc: "튤립의 첫 이름을 의미하는 라레는 새벽의 이슬을 머금은 청초한 푸른 사과를 한 입 베어 문 듯 청량하면서도 절제된 달콤함을 시작으로, 잔잔한 그린 플로럴의 향취가 화이트 튤립의 싱그러운 푸른 잎사귀를 떠오르게 합니다. 진득한 샌달우드에 스파이시한 무드의 레더와 미모사가 더해져 깊고 은은한 여운을 남깁니다.",
                top: "Green Apple, Eucalyptus, Bergamot", mid: "White Tulip, Mimosa, Marine", base: "Sandalwood, Leather, Musk, Coconut",
                accords: ["Green", "Floral"],
                notes: ["Green Apple", "Eucalyptus", "Bergamot", "White Tulip", "Mimosa", "Marine", "Sandalwood", "Leather", "Musk", "Coconut"]
            },
            {
                image: "04.unknown_oud.png",
                title: "UNKNOWN OUD", subtitle: "언노운오드",
                desc: "유칼립투스의 상쾌함으로 시작한 향은 진득한 라즈베리 시럽을 한방울 떨어뜨린 듯한 달콤함이 함께 어우러져 더욱 풍성해집니다. 묵직한 침향나무에서 오는 잔향의 젖은 흙과 그을린 나무냄새는 깊은 숲속에서 홀로 타오르고 남은 불의 흔적을 떠오르게 합니다.",
                top: "Eucalyptus, Lavender", mid: "Raspberry, Leather", base: "Oud(Agarwood), Patchouli, Amber",
                accords: ["Balsamic", "Woody"],
                notes: ["Eucalyptus", "Lavender", "Raspberry", "Leather", "Oud(Agarwood)", "Patchouli", "Amber"]
            },
            {
                image: "05.white_darjeeling.png",
                title: "WHITE DARJEELING", subtitle: "화이트다즐링",
                desc: "화이트 샴페인의 섬세한 거품과 달달한 과일향에 쌉쌀한 다즐링 차 향이 풍성하고 조화롭게 어우러져 찻잔 속에서 추는 우아한 향의 춤의 향연을 선사합니다. 코끝에서부터 전해지는 크리미한 머스크와 샌달우드가 부드러운 잔향을 오래도록 느끼게 해줍니다.",
                top: "White Champagne", mid: "Black Tea, Peach", base: "Musk, Sandalwood",
                accords: ["Fruity", "Tea"],
                notes: ["White Champagne", "Black Tea", "Peach", "Musk", "Sandalwood"]
            }
        ];

        let currentQuizQueue = [];
        let currentQuestionIndex = 0;
        let score = 0;

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const startBtn = document.getElementById('start-btn');
        const perfumeImage = document.getElementById('perfume-image');
        const optionsContainer = document.getElementById('options-container');
        const feedbackText = document.getElementById('feedback-text');
        const restartBtn = document.getElementById('restart-btn');
        const progressText = document.getElementById('progress-text');

        const detailModal = document.getElementById('detail-modal');
        const modalStatusTitle = document.getElementById('modal-status-title');
        const modalNextBtn = document.getElementById('modal-next-btn');

        // 전체 향료 추출 (중복 제거)
        const allAvailableNotes = [...new Set(productData.flatMap(p => p.notes))];

        // 2. 퀴즈 생성 로직: 매번 랜덤하게 정답과 보기를 생성
        function generateQuiz() {
            currentQuizQueue = productData.map(product => {
                // 정답 랜덤 추출 (현재 향수의 notes 중 하나)
                const randomAnswer = product.notes[Math.floor(Math.random() * product.notes.length)];
                
                // 오답 5개 추출 (전체 향료 중 현재 향수에 포함되지 않은 것들)
                const wrongNotes = allAvailableNotes
                    .filter(note => !product.notes.includes(note)) // 현재 향수 향료 제외
                    .sort(() => Math.random() - 0.5)               // 셔플
                    .slice(0, 5);                                  // 5개 뽑기
                
                // 보기 6개 생성 및 셔플
                const options = [randomAnswer, ...wrongNotes].sort(() => Math.random() - 0.5);

                // 출제용 객체 리턴
                return {
                    ...product,
                    answer: randomAnswer,
                    options: options
                };
            }).sort(() => Math.random() - 0.5); // 향수 출제 순서도 셔플
        }

        startBtn.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            generateQuiz();
            loadQuestion();
        });

        function loadQuestion() {
            feedbackText.textContent = '';
            feedbackText.className = 'text-2xl font-bold h-8 mb-4';
            optionsContainer.innerHTML = '';
            
            const currentQuestion = currentQuizQueue[currentQuestionIndex];
            perfumeImage.src = currentQuestion.image;
            progressText.textContent = `Note ${currentQuestionIndex + 1} / ${currentQuizQueue.length}`;

            currentQuestion.options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'nameplate-btn';
                button.textContent = option;
                button.addEventListener('click', () => handleGuess(option, button));
                optionsContainer.appendChild(button);
            });
        }

        function handleGuess(selectedOption, buttonElement) {
            const currentQuestion = currentQuizQueue[currentQuestionIndex];
            const isCorrect = selectedOption === currentQuestion.answer;
            const allButtons = optionsContainer.querySelectorAll('button');
            allButtons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                feedbackText.textContent = 'Correct!';
                feedbackText.className = 'text-2xl font-bold h-8 mb-4 text-green-600';
                buttonElement.classList.add('correct');
                modalStatusTitle.textContent = "Correct! Review the details.";
                modalStatusTitle.className = "font-bold text-green-600 text-lg";
                score++;
            } else {
                feedbackText.textContent = 'Incorrect!';
                feedbackText.className = 'text-2xl font-bold h-8 mb-4 text-red-500';
                buttonElement.classList.add('incorrect');
                modalStatusTitle.textContent = "Incorrect! Review the details.";
                modalStatusTitle.className = "font-bold text-red-500 text-lg";
                
                // 오답일 경우 정답 표시
                allButtons.forEach(btn => {
                    if (btn.textContent === currentQuestion.answer) {
                        btn.classList.add('correct');
                    }
                });
            }

            // 모달 데이터 채우기
            setTimeout(() => {
                document.getElementById('ui-title').textContent = currentQuestion.title;
                document.getElementById('ui-subtitle').textContent = currentQuestion.subtitle;
                document.getElementById('ui-desc').textContent = currentQuestion.desc;
                document.getElementById('ui-top').textContent = currentQuestion.top;
                document.getElementById('ui-mid').textContent = currentQuestion.mid;
                document.getElementById('ui-base').textContent = currentQuestion.base;
                
                const accordsContainer = document.getElementById('ui-accords');
                accordsContainer.innerHTML = '';
                currentQuestion.accords.forEach(accord => {
                    const span = document.createElement('span');
                    span.className = "bg-gray-200 text-gray-700 text-xs font-bold px-3 py-1 rounded-full";
                    span.textContent = accord;
                    accordsContainer.appendChild(span);
                });
                
                if (currentQuestionIndex === currentQuizQueue.length - 1) {
                    modalNextBtn.textContent = "Result";
                } else {
                    modalNextBtn.textContent = "Next";
                }
                
                detailModal.classList.remove('hidden');
            }, 800);
        }

        modalNextBtn.addEventListener('click', () => {
            detailModal.classList.add('hidden'); 
            
            if (currentQuestionIndex < currentQuizQueue.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                feedbackText.textContent = `Final Score: ${score} / ${currentQuizQueue.length}`;
                feedbackText.className = 'text-2xl font-bold h-8 mb-4 text-blue-600';
                restartBtn.classList.remove('hidden');
            }
        });

        restartBtn.addEventListener('click', () => {
            currentQuestionIndex = 0;
            score = 0;
            restartBtn.classList.add('hidden');
            generateQuiz(); // 퀴즈 다시 생성
            loadQuestion(); 
        });
    </script>
</body>
</html>
