<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Notes Training</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans', sans-serif;
            background-color: #e1ebd1; /* Light pastel green background */
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight on mobile */
        }

        /* Polaroid style image frame */
        .polaroid-frame {
            background-color: #fcfcfc;
            padding: 16px;
            box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Beveled nameplate style for buttons */
        .nameplate-btn {
            background-color: #ffffff;
            border: 8px solid #f2f4ee; /* Thick off-white border */
            box-shadow: 1px 2px 5px rgba(0, 0, 0, 0.05);
            color: #333333;
            font-weight: 500;
            padding: 12px 4px;
            transition: all 0.2s ease;
            cursor: pointer;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            word-break: keep-all;
        }

        /* Active click effect for buttons */
        .nameplate-btn:active:not(:disabled) {
            transform: scale(0.96);
            box-shadow: inset 1px 2px 4px rgba(0, 0, 0, 0.1);
        }

        /* Correct answer style */
        .nameplate-btn.correct {
            border-color: #4ade80 !important; /* Tailwind green-400 */
            background-color: #f0fdf4; /* Tailwind green-50 */
            color: #166534;
            font-weight: 700;
        }

        /* Incorrect answer style */
        .nameplate-btn.incorrect {
            border-color: #f87171 !important; /* Tailwind red-400 */
            background-color: #fef2f2; /* Tailwind red-50 */
            color: #991b1b;
            font-weight: 700;
        }

        .nameplate-btn:disabled {
            cursor: default;
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen text-gray-800 py-10 px-4 relative">

    <!-- Start Screen -->
    <div id="start-screen" class="w-full max-w-md flex flex-col items-center justify-center min-h-[80vh]">
        <h1 class="text-3xl font-bold text-gray-800 tracking-tight mb-8 text-center">Perfume Notes<br>Training</h1>
        
        <!-- Logo Image Section -->
        <div class="polaroid-frame mx-auto w-4/5 max-w-[280px] aspect-square mb-12">
            <img src="image_112062.png" alt="Tamburins Logo" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/400x400/ffffff/333333?text=TAMBURINS'">
        </div>

        <button id="start-btn" class="w-full max-w-[250px] bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 px-6 rounded-full shadow-lg transition-transform active:scale-95 text-lg">
            Start Quiz
        </button>
    </div>

    <!-- Quiz Screen (Hidden Initially) -->
    <div id="quiz-screen" class="w-full max-w-md hidden">
        
        <!-- Header / Progress -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Identify the Note</h1>
            <p id="progress-text" class="text-gray-600 mt-1 text-sm font-medium">Question 1 / 3</p>
        </div>

        <!-- Image Section -->
        <div class="polaroid-frame mx-auto w-4/5 max-w-[280px] aspect-square mb-10">
            <img id="perfume-image" src="" alt="Perfume" class="w-full h-full object-contain">
        </div>

        <!-- Options Grid (2x3) -->
        <div id="options-container" class="grid grid-cols-2 gap-x-4 gap-y-5">
            <!-- Buttons will be injected here via JavaScript -->
        </div>

        <!-- Feedback & Navigation Section -->
        <div class="mt-8 flex flex-col items-center min-h-[100px]">
            <!-- Feedback Text (Correct/Incorrect) -->
            <div id="feedback-text" class="text-2xl font-bold h-8 mb-4 transition-opacity duration-300"></div>
            
            <!-- Next Button -->
            <button id="next-btn" class="hidden w-full max-w-[200px] bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-transform active:scale-95">
                Next
            </button>
            
            <!-- Restart Button -->
            <button id="restart-btn" class="hidden w-full max-w-[200px] bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-transform active:scale-95">
                Restart
            </button>
        </div>
    </div>

    <!-- Creator Info Watermark (Discreet, bottom right) -->
    <div class="fixed bottom-2 right-2 text-[10px] text-gray-700 opacity-40 text-right pointer-events-none md:text-xs">
        Name: [이지엽] | Email: [tam1532@tamburins.com] <br> 
        Store: [TAM_서울_DS_현대_무역] | Team: [스토어브랜딩팀]
    </div>

    <script>
        // Quiz Data Array (English)
        const quizData = [
            {
                image: "01.chamo.png", // The actual perfume bottle image you shared
                options: ["Bergamot", "Sandalwood", "Patchouli", "Fig", "Chamomile", "Cedarwood"],
                answer: "Chamomile"
            },
            {
                image: "https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?auto=format&fit=crop&w=400&q=80",
                options: ["Rose", "Jasmine", "Tuberose", "Lily", "Peony", "Iris"],
                answer: "Rose"
            },
            {
                image: "https://images.unsplash.com/photo-1595532542520-50cb05cb22d0?auto=format&fit=crop&w=400&q=80",
                options: ["Lemon", "Neroli", "Orange Blossom", "Tangerine", "Grapefruit", "Yuzu"],
                answer: "Neroli"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const startBtn = document.getElementById('start-btn');
        
        const perfumeImage = document.getElementById('perfume-image');
        const optionsContainer = document.getElementById('options-container');
        const feedbackText = document.getElementById('feedback-text');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const progressText = document.getElementById('progress-text');

        function startQuiz() {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            currentQuestionIndex = 0;
            score = 0;
            loadQuestion();
        }

        function loadQuestion() {
            // Reset state for new question
            feedbackText.textContent = '';
            feedbackText.className = 'text-2xl font-bold h-8 mb-4';
            nextBtn.classList.add('hidden');
            optionsContainer.innerHTML = '';
            
            const currentQuestion = quizData[currentQuestionIndex];
            
            // Update Image and Progress with fallback image support
            perfumeImage.src = currentQuestion.image;
            perfumeImage.onerror = () => { perfumeImage.src = 'https://placehold.co/400x400/ffffff/333333?text=Perfume+Bottle'; };
            progressText.textContent = `Question ${currentQuestionIndex + 1} / ${quizData.length}`;

            // Generate option buttons
            currentQuestion.options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'nameplate-btn';
                button.textContent = option;
                
                // Add click event listener for checking the answer
                button.addEventListener('click', () => handleGuess(option, button));
                
                optionsContainer.appendChild(button);
            });
        }

        function handleGuess(selectedOption, buttonElement) {
            const currentQuestion = quizData[currentQuestionIndex];
            const isCorrect = selectedOption === currentQuestion.answer;

            // Disable all buttons to prevent multiple guesses
            const allButtons = optionsContainer.querySelectorAll('button');
            allButtons.forEach(btn => btn.disabled = true);

            // Apply styles and feedback text based on result
            if (isCorrect) {
                feedbackText.textContent = 'Correct!';
                feedbackText.classList.add('text-green-600');
                buttonElement.classList.add('correct');
                score++;
            } else {
                feedbackText.textContent = 'Incorrect!';
                feedbackText.classList.add('text-red-500');
                buttonElement.classList.add('incorrect');
                
                // Highlight the correct answer to show the user what it was
                allButtons.forEach(btn => {
                    if (btn.textContent === currentQuestion.answer) {
                        btn.classList.add('correct');
                    }
                });
            }

            // Show 'Next' button or 'Restart' button if it's the last question
            if (currentQuestionIndex < quizData.length - 1) {
                nextBtn.classList.remove('hidden');
            } else {
                // End of quiz
                setTimeout(() => {
                    feedbackText.textContent = `Quiz Complete! (${score}/${quizData.length} Correct)`;
                    feedbackText.classList.remove('text-green-600', 'text-red-500');
                    feedbackText.classList.add('text-blue-600');
                    restartBtn.classList.remove('hidden');
                }, 1000);
            }
        }

        // Event Listeners
        startBtn.addEventListener('click', startQuiz);

        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            loadQuestion();
        });

        restartBtn.addEventListener('click', () => {
            currentQuestionIndex = 0;
            score = 0;
            restartBtn.classList.add('hidden');
            loadQuestion();
        });

    </script>
</body>
</html>
