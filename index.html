<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>향수 노트 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #e1ebd1; /* Light pastel green background */
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight on mobile */
        }

        /* Polaroid style image frame */
        .polaroid-frame {
            background-color: #fcfcfc;
            padding: 16px;
            box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Beveled nameplate style for buttons */
        .nameplate-btn {
            background-color: #ffffff;
            border: 8px solid #f2f4ee; /* Thick off-white border */
            box-shadow: 1px 2px 5px rgba(0, 0, 0, 0.05);
            color: #333333;
            font-weight: 500;
            padding: 12px 4px;
            transition: all 0.2s ease;
            cursor: pointer;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            word-break: keep-all;
        }

        /* Active click effect for buttons */
        .nameplate-btn:active:not(:disabled) {
            transform: scale(0.96);
            box-shadow: inset 1px 2px 4px rgba(0, 0, 0, 0.1);
        }

        /* Correct answer style */
        .nameplate-btn.correct {
            border-color: #4ade80; /* Tailwind green-400 */
            background-color: #f0fdf4; /* Tailwind green-50 */
            color: #166534;
            font-weight: 700;
        }

        /* Incorrect answer style */
        .nameplate-btn.incorrect {
            border-color: #f87171; /* Tailwind red-400 */
            background-color: #fef2f2; /* Tailwind red-50 */
            color: #991b1b;
            font-weight: 700;
        }

        .nameplate-btn:disabled {
            cursor: default;
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen text-gray-800 py-10 px-4">

    <!-- Mobile container -->
    <div class="w-full max-w-md">
        
        <!-- Header / Progress -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">향수 노트 맞추기</h1>
            <p id="progress-text" class="text-gray-600 mt-1 text-sm font-medium">문제 1 / 3</p>
        </div>

        <!-- Image Section -->
        <div class="polaroid-frame mx-auto w-4/5 max-w-[280px] aspect-square mb-10">
            <img id="perfume-image" src="" alt="Perfume" class="w-full h-full object-contain">
        </div>

        <!-- Options Grid (2x3) -->
        <div id="options-container" class="grid grid-cols-2 gap-x-4 gap-y-5">
            <!-- Buttons will be injected here via JavaScript -->
        </div>

        <!-- Feedback & Navigation Section -->
        <div class="mt-8 flex flex-col items-center min-h-[100px]">
            <!-- Feedback Text (정답/오답) -->
            <div id="feedback-text" class="text-2xl font-bold h-8 mb-4 transition-opacity duration-300"></div>
            
            <!-- Next Button -->
            <button id="next-btn" class="hidden w-full max-w-[200px] bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-transform active:scale-95">
                다음 ->
            </button>
            
            <!-- Restart Button -->
            <button id="restart-btn" class="hidden w-full max-w-[200px] bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-transform active:scale-95">
                다시 시작하기
            </button>
        </div>

    </div>

    <script>
        // Quiz Data Array
        const quizData = [
            {
                // Generic placeholder for a woody/citrus perfume
                image: "https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=400&q=80",
                options: ["베르가못", "샌달우드", "파촐리", "무화과", "머스크", "시더우드"],
                answer: "샌달우드"
            },
            {
                // Generic placeholder for a floral perfume
                image: "https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?auto=format&fit=crop&w=400&q=80",
                options: ["로즈", "자스민", "튜베로즈", "릴리", "피오니", "아이리스"],
                answer: "로즈"
            },
            {
                // Generic placeholder for a fresh/citrus perfume
                image: "https://images.unsplash.com/photo-1595532542520-50cb05cb22d0?auto=format&fit=crop&w=400&q=80",
                options: ["레몬", "네롤리", "오렌지 블라썸", "탠저린", "자몽", "유자"],
                answer: "네롤리"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        // DOM Elements
        const perfumeImage = document.getElementById('perfume-image');
        const optionsContainer = document.getElementById('options-container');
        const feedbackText = document.getElementById('feedback-text');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const progressText = document.getElementById('progress-text');

        function loadQuestion() {
            // Reset state for new question
            feedbackText.textContent = '';
            feedbackText.className = 'text-2xl font-bold h-8 mb-4';
            nextBtn.classList.add('hidden');
            optionsContainer.innerHTML = '';
            
            const currentQuestion = quizData[currentQuestionIndex];
            
            // Update Image and Progress
            perfumeImage.src = currentQuestion.image;
            progressText.textContent = `문제 ${currentQuestionIndex + 1} / ${quizData.length}`;

            // Generate option buttons
            currentQuestion.options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'nameplate-btn';
                button.textContent = option;
                
                // Add click event listener for checking the answer
                button.addEventListener('click', () => handleGuess(option, button));
                
                optionsContainer.appendChild(button);
            });
        }

        function handleGuess(selectedOption, buttonElement) {
            const currentQuestion = quizData[currentQuestionIndex];
            const isCorrect = selectedOption === currentQuestion.answer;

            // Disable all buttons to prevent multiple guesses
            const allButtons = optionsContainer.querySelectorAll('button');
            allButtons.forEach(btn => btn.disabled = true);

            // Apply styles and feedback text based on result
            if (isCorrect) {
                feedbackText.textContent = '정답입니다!';
                feedbackText.classList.add('text-green-600');
                buttonElement.classList.add('correct');
                score++;
            } else {
                feedbackText.textContent = '오답입니다!';
                feedbackText.classList.add('text-red-500');
                buttonElement.classList.add('incorrect');
                
                // Optionally highlight the correct answer
                allButtons.forEach(btn => {
                    if (btn.textContent === currentQuestion.answer) {
                        btn.classList.add('correct');
                    }
                });
            }

            // Show 'Next' button or 'Restart' button if it's the last question
            if (currentQuestionIndex < quizData.length - 1) {
                nextBtn.classList.remove('hidden');
            } else {
                // End of quiz
                setTimeout(() => {
                    feedbackText.textContent = `퀴즈 완료! (${score}/${quizData.length} 정답)`;
                    feedbackText.classList.remove('text-green-600', 'text-red-500');
                    feedbackText.classList.add('text-blue-600');
                    restartBtn.classList.remove('hidden');
                }, 1000);
            }
        }

        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            loadQuestion();
        });

        restartBtn.addEventListener('click', () => {
            currentQuestionIndex = 0;
            score = 0;
            restartBtn.classList.add('hidden');
            loadQuestion();
        });

        // Initialize the first question on load
        window.onload = loadQuestion;

    </script>
</body>
</html>
